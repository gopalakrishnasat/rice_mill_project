<div class="app-root-layout">
  <!-- Full-Width Top Header (Contains Brand Logo & User Profile) -->
  <app-header *ngIf="showNavigation()"></app-header>

  <!-- Main Body Layout: Sidebar is below the header on the left -->
  <div class="app-body-layout" [class.has-sidebar]="showNavigation()" [class.sidebar-collapsed]="isSidebarCollapsed()">
    <app-sidebar *ngIf="showNavigation()"></app-sidebar>
    <main class="main-content-area">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Application-Wide Custom Confirm & Alert Modal -->
  <app-confirm-dialog></app-confirm-dialog>

  <!-- Global Bottom-Middle Floating Snackbar Notification -->
  <app-snackbar></app-snackbar>
</div>
