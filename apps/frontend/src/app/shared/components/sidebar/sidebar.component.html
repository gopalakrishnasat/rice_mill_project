<aside class="sidebar" [class.collapsed]="isCollapsed()" id="app-sidebar">
  <!-- Navigation Links -->
  <nav class="sidebar-nav">
    <div class="nav-section-header" *ngIf="!isCollapsed()">
      <span>NAVIGATION</span>
    </div>

    <!-- 1. Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
      [title]="isCollapsed() ? 'Dashboard' : ''"
      id="sidebar-nav-dashboard"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </span>
      <span class="nav-text" *ngIf="!isCollapsed()">Dashboard</span>
      <span class="active-glow" *ngIf="!isCollapsed()"></span>
    </a>

    <!-- 2. Invoices & Billing -->
    <a
      routerLink="/invoices"
      routerLinkActive="active"
      class="nav-link"
      [title]="isCollapsed() ? 'Invoices & Billing' : ''"
      id="sidebar-nav-invoices"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </span>
      <span class="nav-text" *ngIf="!isCollapsed()">Invoices & Billing</span>
      <span class="active-glow" *ngIf="!isCollapsed()"></span>
    </a>

    <!-- 3. Buyers & Customers -->
    <a
      routerLink="/customers"
      routerLinkActive="active"
      class="nav-link"
      [title]="isCollapsed() ? 'Buyers & Customers' : ''"
      id="sidebar-nav-customers"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </span>
      <span class="nav-text" *ngIf="!isCollapsed()">Buyers & Customers</span>
      <span class="active-glow" *ngIf="!isCollapsed()"></span>
    </a>

    <!-- 4. User Directory (Super Admin Only) -->
    <a
      routerLink="/users"
      routerLinkActive="active"
      class="nav-link"
      *ngIf="isSuperAdmin()"
      [title]="isCollapsed() ? 'User Directory' : ''"
      id="sidebar-nav-users"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </span>
      <span class="nav-text" *ngIf="!isCollapsed()">User Directory</span>
      <span class="active-glow" *ngIf="!isCollapsed()"></span>
    </a>
  </nav>

  <!-- Sidebar Footer / Collapse Toggle -->
  <div class="sidebar-footer">
    <button
      type="button"
      class="toggle-btn"
      (click)="toggleCollapse()"
      [title]="isCollapsed() ? 'Expand Navigation Sidebar' : 'Collapse Navigation Sidebar'"
      id="sidebar-toggle-btn"
    >
      <span class="toggle-icon">
        <svg
          *ngIf="!isCollapsed()"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          stroke="currentColor"
          stroke-width="2.2"
          fill="none"
        >
          <polyline points="11 17 6 12 11 7"></polyline>
          <polyline points="18 17 13 12 18 7"></polyline>
        </svg>
        <svg
          *ngIf="isCollapsed()"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          stroke="currentColor"
          stroke-width="2.2"
          fill="none"
        >
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </span>
      <span class="toggle-text" *ngIf="!isCollapsed()">Collapse Sidebar</span>
    </button>
  </div>
</aside>
